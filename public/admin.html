<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Masjid Bilal Phoenix</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><header class="site-header"><a class="brand" href="/"><span class="brand-mark">م</span><span><strong>Masjid Bilal</strong><small>Private admin</small></span></a><a class="text-link" href="/">← Back to site</a></header><main class="admin-main"><section id="login-panel" class="admin-login"><p class="eyebrow">Private area</p><h1>Masjid control panel</h1><p>Update the public prayer times and notices.</p><form id="login-form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="button button-dark" type="submit">Unlock panel <span>→</span></button><p id="login-message" class="form-message"></p></form></section><section id="admin-panel" hidden><div class="admin-heading"><div><p class="eyebrow">Private area</p><h1>Control panel</h1></div><button id="logout" class="button button-outline">Log out</button></div><form id="content-form"><div class="admin-block"><div class="section-heading"><div><p class="eyebrow">Public homepage</p><h2>Iqama times</h2></div></div><div id="time-fields" class="time-fields"></div></div><div class="admin-block"><p class="eyebrow">Keep it short</p><h2>Announcements</h2><div class="announcement-fields"><input id="announcement-1" maxlength="120" placeholder="First announcement"><input id="announcement-2" maxlength="120" placeholder="Second announcement"></div><p class="small-note">Leave both blank to hide the announcement section.</p></div><button class="button button-dark" type="submit">Save updates <span>✓</span></button><p id="save-message" class="form-message"></p></form></section></main><script src="/admin.js"></script></body></html>
